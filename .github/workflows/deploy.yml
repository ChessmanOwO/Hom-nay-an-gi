name: CI/CD Pipeline - Hôm nay ăn gì

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: 🧪 Kiểm định & Build kiểm thử
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Kiểm tra kiểu TypeScript & cú pháp deploy script
        run: |
          npx tsc --noEmit
          bash -n deploy_azure.sh

      - name: Build VPS client & server bundle
        run: npm run build:vps

      - name: Chạy toàn bộ Unit, Auth, Limit, Abuse & PostgreSQL Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          npx tsx tests/unit.ts
          npx tsx tests/place-limit.ts
          npx tsx tests/abuse.ts
          npx tsx tests/firebase-auth.ts
          npm run test:postgres
          npm run test:postgres-http

  deploy:
    name: 🚀 Tự động Deploy lên Azure VM
    needs: [test-and-verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Kết nối SSH và cập nhật ứng dụng trên Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [CI/CD] Bắt đầu đồng bộ mã nguồn trên Azure VM..."
            cd ~/Hom-nay-an-gi || cd /home/$USER/Hom-nay-an-gi

            echo "📥 [CI/CD] Kéo code mới nhất từ nhánh main..."
            git fetch origin main
            git reset --hard origin/main

            PREVIOUS_CONTAINER="$(sudo docker compose --env-file .env.vps -f compose.vps.yaml ps -q web || true)"
            PREVIOUS_IMAGE=""
            if [ -n "$PREVIOUS_CONTAINER" ]; then
              PREVIOUS_IMAGE="$(sudo docker inspect --format '{{.Image}}' "$PREVIOUS_CONTAINER" 2>/dev/null || true)"
            fi

            echo "🐳 [CI/CD] Đang build lại Docker container và áp dụng migration..."
            sudo docker compose --env-file .env.vps -f compose.vps.yaml up -d --build

            echo "🩺 [CI/CD] Kiểm tra sức khỏe ứng dụng tại /healthz..."
            HEALTHY=0
            for _ in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "❌ [CI/CD] Container mới không vượt qua /healthz! Bắt đầu khôi phục..." >&2
              sudo docker compose --env-file .env.vps -f compose.vps.yaml logs --tail=80 web postgres >&2 || true
              if [ -n "$PREVIOUS_IMAGE" ]; then
                CURRENT_REPO_TAG="$(sudo docker compose --env-file .env.vps -f compose.vps.yaml images web --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | head -n 1 || true)"
                if [ -n "$CURRENT_REPO_TAG" ] && [ "$CURRENT_REPO_TAG" != "<none>:<none>" ]; then
                  sudo docker tag "$PREVIOUS_IMAGE" "$CURRENT_REPO_TAG" || true
                  sudo docker compose --env-file .env.vps -f compose.vps.yaml up -d --no-build web || true
                fi
              fi
              exit 1
            fi

            echo "🧹 [CI/CD] Dọn dẹp docker images cũ..."
            sudo docker image prune -f

            echo "✅ [CI/CD] Triển khai thành công 100%! Ứng dụng đã sẵn sàng."
